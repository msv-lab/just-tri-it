        <path d="M 0 -8 L 40 -8"/>
        <path d="M -52 12 L 14 12"/>
        <path d="M 24 12 L 52 12"/>
        <path d="M -52 32 L -22 32"/>
      </g>
    </g>
    <!-- THE CLONE SUSPECT (from branding assets; feet at y=0, centered on x=0) -->
    <g id="clone" stroke="#3B3128" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="-32" cy="-9" rx="27" ry="11" fill="#141C30"/>
      <ellipse cx="32" cy="-9" rx="27" ry="11" fill="#141C30"/>
      <rect x="-42" y="-115" width="34" height="103" fill="#141C30"/>
      <rect x="8" y="-115" width="34" height="103" fill="#141C30"/>
      <path d="M -86,-398 C -100,-330 -104,-170 -96,-85 L 96,-85 C 104,-170 100,-330 86,-398 C 52,-424 -52,-424 -86,-398 Z" fill="#7A2E35"/>
      <path d="M 10,-170 C 11,-140 12,-115 12,-92" fill="none"/>
      <circle cx="-14" cy="-155" r="5" fill="#C9A227"/>
      <circle cx="-14" cy="-120" r="5" fill="#C9A227"/>
      <rect x="-102" y="-198" width="204" height="26" rx="6" fill="#7A2E35"/>
      <rect x="-15" y="-195" width="30" height="20" rx="3" fill="#C9A227"/>
      <rect x="-16" y="-430" width="32" height="36" fill="#EAC9A3"/>
      <path d="M -42,-410 L -12,-396 L -38,-366 Z" fill="#7A2E35"/>
      <path d="M 42,-410 L 12,-396 L 38,-366 Z" fill="#7A2E35"/>
      <path d="M -76,-400 C -112,-372 -122,-300 -92,-250 C -80,-231 -56,-229 -48,-244 C -68,-262 -78,-330 -64,-394 Z" fill="#7A2E35"/>
      <path d="M 76,-400 C 112,-372 122,-300 92,-250 C 80,-231 56,-229 48,-244 C 68,-262 78,-330 64,-394 Z" fill="#7A2E35"/>
      <rect x="-58" y="-302" width="116" height="84" rx="6" fill="#FAF5EA"/>
      <g fill="none" stroke-width="4">
        <path d="M -40,-282 L -12,-282"/>
        <path d="M -2,-282 L 30,-282"/>
        <path d="M -40,-263 L 8,-263"/>
        <path d="M 18,-263 L 40,-263"/>
        <path d="M -40,-244 L -20,-244"/>
        <path d="M -10,-244 L 14,-244"/>
      </g>
      <circle cx="-36" cy="-216" r="13" fill="#EAC9A3"/>
      <circle cx="36" cy="-216" r="13" fill="#EAC9A3"/>
      <circle cx="-42" cy="-452" r="8" fill="#D9AF85"/>
      <circle cx="42" cy="-452" r="8" fill="#D9AF85"/>
      <ellipse cx="0" cy="-458" rx="43" ry="47" fill="#EAC9A3"/>
      <path d="M -47,-486 C -47,-526 47,-526 47,-486 C 18,-497 -18,-497 -47,-486 Z" fill="#CDBA98"/>
      <path d="M -47,-486 C -18,-475 18,-475 47,-486 C 18,-496 -18,-496 -47,-486 Z" fill="#CDBA98"/>
      <circle cx="0" cy="-516" r="4" fill="#CDBA98"/>
      <ellipse cx="-15" cy="-456" rx="9.5" ry="6.5" fill="#FAF5EA"/>
      <ellipse cx="17" cy="-456" rx="9.5" ry="6.5" fill="#FAF5EA"/>
      <circle cx="-21" cy="-456" r="3.4" fill="#3B3128" stroke="none"/>
      <circle cx="11" cy="-456" r="3.4" fill="#3B3128" stroke="none"/>
      <path d="M -25,-470 L -8,-467" fill="none"/>
      <path d="M 9,-468 L 26,-472" fill="none"/>
      <path d="M 1,-450 C 5,-444 5,-439 -1,-437" fill="none"/>
      <path d="M -16,-422 C -8,-426 0,-426 6,-422" fill="none"/>
