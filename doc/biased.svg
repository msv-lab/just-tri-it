  <!-- ===== edges ===== -->
  <!-- d -> p : sampling -->
  <path d="M 490 195 L 305 390" fill="none" stroke="#3B3128" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- d -> q : the witness comes from the SAME problem, no transformation -->
  <path d="M 610 195 L 795 390" fill="none" stroke="#3B3128" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- p - q : agreement -->
  <path d="M 330 645 L 495 645" fill="none" stroke="#3B3128" stroke-width="4"/>
  <path d="M 605 645 L 760 645" fill="none" stroke="#3B3128" stroke-width="4"/>

  <!-- ===== the problem ===== -->
  <use href="#folder" x="550" y="140"/>
  <text x="550" y="52" text-anchor="middle" font-size="30" fill="#3B3128">problem <tspan font-style="italic">d</tspan> under investigation</text>

  <!-- ===== edge labels ===== -->
  <text x="385" y="252" text-anchor="end" font-size="24" fill="#3B3128">sample</text>
  <text x="385" y="282" text-anchor="end" font-size="24" font-style="italic" fill="#3B3128">p &#8764; LLM(&#183; | d)</text>

  <text x="720" y="252" text-anchor="start" font-size="24" fill="#3B3128">formalize</text>
  <text x="720" y="282" text-anchor="start" font-size="24" font-style="italic" fill="#3B3128">q &#8764; LLM(&#183; | d)</text>

  <!-- ===== the suspect: program p ===== -->
  <svg x="200" y="375" width="99" height="270" viewBox="82 70 216 590">
    <use href="#clone" transform="translate(190,648)"/>
  </svg>
  <text x="250" y="690" text-anchor="middle" font-size="26" fill="#3B3128">suspect: program <tspan font-style="italic">p</tspan></text>

  <!-- ===== the biased witness: postcondition q (same cloth as the suspects) ===== -->
  <svg x="776" y="372" width="148" height="287" viewBox="100 60 360 700">
  <g stroke="#3B3128" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== behind-back arm (drawn first: sits behind everything) ===== -->
    <g id="arm-back">
      <!-- index finger: near vertical, tip poking up -->
      <rect fill="#EAC9A3" x="-7" y="-42" width="14" height="84" rx="7"
            transform="translate(432 444) rotate(4)"/>
      <!-- middle finger: slim hook wrapping OVER the index near its tip -->
      <path fill="#EAC9A3" d="M 436 487
        L 436 450
        Q 436 446 433 442
        L 415 424
        Q 408 415 416 410
        Q 423 405 428 412
        L 444 431
        Q 450 437 450 443
        L 450 487
        Q 450 494 443 494
        Q 436 494 436 487 Z"/>
      <!-- small fist emerging from behind the coat at the hip -->
      <ellipse fill="#EAC9A3" cx="428" cy="480" rx="28" ry="22" transform="rotate(-10 428 480)"/>
      <!-- slim sleeve down the side, elbow tucking behind the coat -->
      <path fill="#7A2E35" d="M 378 288
        C 398 296 412 318 418 346
        C 421 368 416 390 406 402
        C 400 410 395 408 393 400
        C 391 384 391 366 390 348
        C 388 318 380 302 374 292 Z"/>
    </g>

    <!-- ===== legs ===== -->
    <g id="legs">
      <rect fill="#1F2A44" x="246" y="600" width="46" height="118"/>
      <rect fill="#1F2A44" x="308" y="600" width="46" height="118"/>
      <path fill="#141C30" d="M 292 712 L 292 740 Q 292 752 278 752 L 234 752
        Q 222 752 224 740 Q 226 726 244 716 L 244 712 Z"/>
      <path fill="#141C30" d="M 308 712 L 308 740 Q 308 752 322 752 L 366 752
        Q 378 752 376 740 Q 374 726 356 716 L 356 712 Z"/>
    </g>

    <!-- ===== torso / coat ===== -->
    <g id="torso">
      <!-- neck -->
      <rect fill="#EAC9A3" x="282" y="222" width="36" height="62"/>
      <!-- coat body -->
      <path fill="#7A2E35" d="M 255 268
        C 228 272 212 280 205 292
        L 196 440 L 200 618 L 402 618 L 406 440 L 396 292
        C 389 280 372 272 345 268
        Q 300 294 255 268 Z"/>
      <!-- shirt V -->
      <path fill="#FAF5EA" d="M 265 270 L 335 270 L 300 322 Z"/>
      <!-- lapels -->
      <path fill="#7A2E35" d="M 262 270 L 302 314 L 294 352 L 264 320 Z"/>
      <path fill="#7A2E35" d="M 338 270 L 298 314 L 306 352 L 336 320 Z"/>
      <!-- little tie knot -->
      <path fill="#7A2E35" d="M 300 272 L 312 285 L 300 300 L 288 285 Z"/>
      <!-- closure line + buttons -->
      <path fill="none" d="M 300 320 L 300 614"/>
      <circle fill="#C9A227" cx="300" cy="372" r="7"/>
      <circle fill="#C9A227" cx="300" cy="442" r="7"/>
      <circle fill="#C9A227" cx="300" cy="512" r="7"/>
      <!-- alibi card poking out of the pocket -->
      <path fill="#FAF5EA" d="M 232 438 L 276 430 L 280 462 L 236 470 Z"/>
      <path fill="none" d="M 241 448 L 263 444"/>
      <path fill="none" d="M 243 458 L 269 453"/>
      <rect fill="#7A2E35" x="222" y="462" width="64" height="20" rx="7"/>
      <!-- matching pocket on the other side -->
      <rect fill="#7A2E35" x="314" y="462" width="64" height="20" rx="7"/>
      <!-- brass triangle lapel pin -->
      <path fill="#C9A227" d="M 276 328 L 284 342 L 268 342 Z"/>
    </g>

    <!-- ===== oath arm (raised, palm open) ===== -->
    <g id="arm-oath">
      <!-- wrist (under sleeve cuff and palm) -->
      <rect fill="#EAC9A3" x="134" y="212" width="30" height="42" rx="10"/>
      <!-- bent sleeve: shoulder -> elbow -> raised forearm -->
      <path fill="#7A2E35" d="M 200 278
        C 170 292 146 330 137 362
        Q 128 386 120 362
        L 128 252
        Q 130 242 140 242
        L 162 244
        Q 168 246 168 256
        L 172 340
        Q 174 356 188 352
        C 202 348 218 342 230 336
        C 236 316 230 292 212 280 Z"/>
      <!-- four fingers -->
      <rect fill="#EAC9A3" x="112" y="142" width="15" height="64" rx="7.5"/>
      <rect fill="#EAC9A3" x="129" y="126" width="15" height="78" rx="7.5"/>
      <rect fill="#EAC9A3" x="146" y="122" width="15" height="82" rx="7.5"/>
      <rect fill="#EAC9A3" x="163" y="132" width="15" height="74" rx="7.5"/>
      <!-- thumb -->
      <rect fill="#EAC9A3" x="-8" y="-30" width="16" height="42" rx="8"
            transform="translate(178 186) rotate(35)"/>
      <!-- palm over finger bases -->
      <path fill="#EAC9A3" d="M 117 190
        Q 115 174 127 174
        L 165 174
        Q 177 174 176 190
        L 174 210
        Q 170 228 146 228
        Q 122 228 119 210 Z"/>
    </g>

    <!-- ===== head ===== -->
    <g id="head">
      <ellipse fill="#D9AF85" cx="240" cy="186" rx="11" ry="17"/>
      <ellipse fill="#D9AF85" cx="360" cy="186" rx="11" ry="17"/>
      <ellipse fill="#EAC9A3" cx="300" cy="175" rx="58" ry="72"/>
      <!-- raised eager eyebrows -->
      <path fill="none" d="M 254 164 Q 271 152 288 162"/>
      <path fill="none" d="M 312 162 Q 329 152 346 164"/>
      <!-- big innocent eyes -->
      <circle fill="#FAF5EA" cx="272" cy="186" r="14"/>
      <circle fill="#FAF5EA" cx="328" cy="186" r="14"/>
      <circle fill="#3B3128" stroke="none" cx="275" cy="184" r="6"/>
      <circle fill="#3B3128" stroke="none" cx="325" cy="184" r="6"/>
      <!-- nose -->
      <path fill="none" d="M 300 196 Q 309 208 299 216"/>
      <!-- oily too-wide grin -->
      <path fill="#FAF5EA" d="M 262 222 Q 300 250 338 222 Q 300 234 262 222 Z"/>
    </g>

    <!-- ===== flat cap ===== -->
    <g id="cap">
      <path fill="#CDBA98" d="M 222 140
        C 226 94 260 74 300 74
        C 340 74 374 94 378 140
        C 350 122 250 122 222 140 Z"/>
      <path fill="#CDBA98" d="M 234 136 Q 300 114 366 136 Q 342 150 300 150 Q 258 150 234 136 Z"/>
      <circle fill="#CDBA98" cx="300" cy="78" r="5"/>
    </g>
  </g>
</svg>
  <text x="850" y="690" text-anchor="middle" font-size="26" fill="#3B3128">biased witness: postcondition <tspan font-style="italic">q</tspan></text>

  <!-- ===== the "agreement": corroborating the false alibi ===== -->
  <g transform="translate(550,645)">
    <path d="M -7 -42 Q 0 -46 7 -42 Q 24 -30 34 -8 Q 42 10 36 22 Q 31 32 16 34 Q 0 37 -16 34 Q -31 32 -36 22 Q -42 10 -34 -8 Q -24 -30 -7 -42 Z"
          fill="#FAF5EA" stroke="#C9A227" stroke-width="9"/>
    <path d="M -7 -42 Q 0 -46 7 -42 Q 24 -30 34 -8 Q 42 10 36 22 Q 31 32 16 34 Q 0 37 -16 34 Q -31 32 -36 22 Q -42 10 -34 -8 Q -24 -30 -7 -42 Z"
          fill="none" stroke="#3B3128" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- an oxblood check: q "verifies" p, but merely retells its story -->
    <path d="M -14 -4 L -4 10 L 16 -18" fill="none" stroke="#7A2E35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="550" y="730" text-anchor="middle" font-size="26" fill="#3B3128">&#8220;verified&#8221; &#8212; the false alibi corroborated</text>
</svg>
