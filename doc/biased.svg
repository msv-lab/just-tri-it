      <path d="M -88 -58 L -30 -58 Q -22 -58 -22 -50 L -22 -42 L -88 -42 Z" fill="#CDBA98"/>
      <rect x="-90" y="-45" width="180" height="110" rx="10" fill="#CDBA98"/>
